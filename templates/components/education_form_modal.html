<div id="add-education-modal"
    class="project-form-modal"
    popover="auto"
    role="dialog"
    aria-modal="true"
    aria-labelledby="add-education-modal-title">
    <button type="button"
            class="project-form-modal__backdrop"
            popovertarget="add-education-modal"
            popovertargetaction="hide"
            aria-label="Tutup form tambah pendidikan"></button>

    <div class="project-form-modal__content">
        <button type="button"
                class="project-form-modal__close"
                popovertarget="add-education-modal"
                popovertargetaction="hide"
                aria-label="Tutup form tambah pendidikan">×</button>

        <h2 id="add-education-modal-title">Tambah Riwayat Pendidikan</h2>
        <form id="education-form"
            method="post"
            action="{% url 'main:add_education' %}"
            class="project-form">
            {% csrf_token %}
            {% for field in form %}
                <div class="form-group" {% if field.name == 'is_current' %}style="display: flex; align-items: center; gap: 0.5rem; margin-top: 0.5rem;"{% endif %}>
                    {% if field.name == 'is_current' %}
                        {{ field }}
                        <label for="{{ field.id_for_label }}" style="margin-bottom: 0; cursor: pointer;">{{ field.label }}</label>
                    {% else %}
                        <label for="{{ field.id_for_label }}">{{ field.label }}</label>
                        {{ field }}
                    {% endif %}
                    {% for error in field.errors %}
                        <p class="form-error">{{ error }}</p>
                    {% endfor %}
                </div>
            {% endfor %}
            <div class="project-form-modal__actions">
                <button type="button"
                        class="button button-secondary"
                        popovertarget="add-education-modal"
                        popovertargetaction="hide">Batal</button>
                <button type="submit" class="button" style="background-color: #ff2d75; color: white;">Tambah Pendidikan</button>
            </div>
        </form>
    </div>
</div>
