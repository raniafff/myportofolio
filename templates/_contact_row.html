<tr id="contact-{{ contact.id }}" style="border-bottom: 1px solid var(--line);">
    <td style="padding: 1rem 1.5rem; font-weight: 500;">{{ contact.name }}</td>
    <td style="padding: 1rem 1.5rem; color: #555;">{{ contact.email }}</td>
    <td style="padding: 1rem 1.5rem;">
        <button type="button" 
                class="button button-secondary"
                style="padding: 0.4rem 0.85rem; margin-right: 0.5rem; cursor: pointer; border-radius: 6px; border: 1px solid var(--line); background: #f3f4f6; font-size: 0.9rem;"
                hx-get="{% url 'main:contact_edit' contact.id %}" 
                hx-target="#contact-{{ contact.id }}" 
                hx-swap="outerHTML">
            Edit
        </button>
        <button type="button" 
                class="button"
                style="padding: 0.4rem 0.85rem; cursor: pointer; border-radius: 6px; border: none; background: #e11d48; color: white; font-size: 0.9rem;"
                hx-delete="{% url 'main:contact_delete' contact.id %}" 
                hx-target="closest tr" 
                hx-swap="outerHTML" 
                hx-confirm="Yakin ingin menghapus kontak {{ contact.name }}?">
            Hapus
        </button>
    </td>
</tr>
